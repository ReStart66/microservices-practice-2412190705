server:
  port: 8081

spring:
  application:
    name: vehicle-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vehicle_db}
    username: ${DB_USER:vehicle_user}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
