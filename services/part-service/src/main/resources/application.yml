server:
  port: 8083

spring:
  application:
    name: part-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/part_db}
    username: ${DB_USER:part_user}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
